name: V5 - Pruebas del reloj de entrada

on:
  push:
    branches: [v5-development]
  pull_request:
    paths:
      - 'engine/**'
      - 'multitimeframe_context.py'
      - 'alpaca_live.py'
      - 'crypto_live.py'
      - 'ui/crypto.html'
      - 'pruebas/test_crypto_v5.py'
      - 'pruebas/test_crypto_observacion_v5.py'
      - 'nvda_demo_v5.py'
      - 'pruebas/test_nvda_demo_v5.py'
      - 'ui/live.html'
      - 'pruebas/test_catalogo_multiactivo_v5.py'
      - 'pruebas/test_calidad_contexto_v5.py'
      - 'pruebas/test_planificacion_v5.py'
      - 'pruebas/test_reloj_entrada_v5.py'
      - 'pruebas/test_validacion_temporal_v5.py'
      - 'pruebas/test_estado_v5.py'
      - 'pruebas/test_api_v5.py'
      - 'v5_diagnostics.py'
      - 'v5_validar_csv.py'
      - 'pruebas/test_csv_v5.py'
      - 'app.py'
      - 'pruebas/test_estado_v5.py'
      - '.github/workflows/v5-reloj-tests.yml'

jobs:
  reloj:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias ligeras V5
        run: python -m pip install Flask==3.1.3 pandas==2.3.3 requests websockets
      - name: Validar sintaxis
        run: python -m compileall -q nvda_demo_v5.py pruebas/test_nvda_demo_v5.py pruebas/test_crypto_observacion_v5.py crypto_live.py multitimeframe_context.py engine v5_diagnostics.py v5_validar_csv.py app.py pruebas/test_reloj_entrada_v5.py pruebas/test_validacion_temporal_v5.py pruebas/test_estado_v5.py pruebas/test_api_v5.py pruebas/test_planificacion_v5.py
      - name: Ejecutar pruebas unitarias V5
        run: python -m unittest discover -s pruebas -p 'test_*v5.py' -v

  regresion_v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas existentes V4 y V5
        run: python -m unittest discover -s pruebas -p 'test_*.py' -v

  arranque_api_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar proyecto
        run: python -m pip install -r requirements.txt
      - name: Comprobar importación Flask y endpoint V5 sin interfaz
        run: python -c 'from app import app; response = app.test_client().get("/api/v5/estado"); assert response.status_code == 200; assert response.json["operativa_autorizada"] is False; assert app.test_client().get("/crypto").status_code == 200'
